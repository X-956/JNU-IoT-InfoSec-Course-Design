[General]
network = FourNodeNetwork
ned-path = ../src
sim-time-limit = 30s
seed-set = ${runnumber}
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
output-scalar-file = ../results/${configname}-${runnumber}.sca
output-vector-file = ../results/${configname}-${runnumber}.vec
**.vector-recording = false
**.scalar-recording = true

**.sendInterval = 1s
**.startTime = 1s
**.stopTime = 20s
**.destId = -1

[Config FourNodeBaseline]
description = "4 node ring baseline: send, route, forward, receive"
network = FourNodeNetwork
**.numSats = 4
**.failureEnabled = false

[Config FourNodeFailure]
description = "4 node ring: node 1 fails at 10s, reroute after 2s"
network = FourNodeNetwork
**.numSats = 4
**.failureEnabled = true
**.failureTime = 10s
**.detectionDelay = 2s
**.recoveryEnabled = true
**.failureNodes = "1"

[Config IslBaseline]
description = "24 node ISL network baseline"
network = IslNetwork
**.numSats = 24
**.failureEnabled = false
**.stopTime = 60s
sim-time-limit = 70s

[Config IslFailure]
description = "24 node ISL: six critical nodes fail at 40s, recovery on"
network = IslNetwork
**.numSats = 24
**.failureEnabled = true
**.failureTime = 40s
**.detectionDelay = 2s
**.recoveryEnabled = true
**.failureNodes = "8,12,1,5,19,23"
**.stopTime = 60s
sim-time-limit = 70s

[Config IslRandomFailure]
description = "24 node ISL: six random nodes fail at 40s, recovery on"
network = IslNetwork
**.numSats = 24
**.failureEnabled = true
**.failureTime = 40s
**.detectionDelay = 2s
**.recoveryEnabled = true
**.failureMode = "random"
**.failureK = 6
**.failureNodes = ""
**.stopTime = 60s
sim-time-limit = 70s

[Config IslNoRecovery]
description = "24 node ISL: same failure, recovery off"
network = IslNetwork
**.numSats = 24
**.failureEnabled = true
**.failureTime = 40s
**.detectionDelay = 2s
**.recoveryEnabled = false
**.failureNodes = "8,12,1,5,19,23"
**.stopTime = 60s
sim-time-limit = 70s

[Config IslRandomNoRecovery]
extends = IslRandomFailure
**.recoveryEnabled = false

[Config IslReroute]
extends = IslFailure
description = "Connected rerouting case: only node 8 fails"
**.failureNodes = "8"

[Config IslRerouteOff]
extends = IslReroute
**.recoveryEnabled = false

[Config CohortBoundary]
extends = IslReroute
description = "Noninteger failure cutoff verifies generation-time cohort"
**.failureTime = 40.1s
