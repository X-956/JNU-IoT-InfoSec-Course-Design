[General]
network = IslNetwork
ned-path = ../src
sim-time-limit = 70s
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
output-scalar-file = ../results/sweep/${configname}-${runnumber}.sca
**.vector-recording = false
**.scalar-recording = true
**.numSats = 24
**.sendInterval = 1s
**.startTime = 1s
**.stopTime = 60s
**.destId = -1
**.failureEnabled = true
**.failureTime = 40s
**.detectionDelay = 2s
**.recoveryEnabled = true


[Config TargetK2]
description = "targeted adaptive betweenness, k=2"
**.failureMode = "list"
**.failureNodes = "8,12"


[Config RandomK2]
description = "random failure, k=2"
**.failureMode = "random"
**.failureK = 2
**.failureNodes = ""


